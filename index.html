<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelo World 2D - Action RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0e27;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
        }

        .health-bar {
            width: 200px;
            height: 30px;
            background: #333;
            border: 2px solid #fff;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            width: 100%;
            transition: width 0.2s ease;
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            pointer-events: auto;
        }

        .mobile-controls.active {
            display: flex;
        }

        .joystick-container {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
        }

        .joystick-thumb {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .attack-button {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ff4444, #cc0000);
            border: 3px solid #ff8888;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            pointer-events: auto;
        }

        .attack-button:active {
            transform: scale(0.9);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        .dash-button {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #4444ff, #0000cc);
            border: 3px solid #8888ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.5);
            pointer-events: auto;
            margin-right: 20px;
        }

        .dash-button:active {
            transform: scale(0.9);
            box-shadow: 0 0 25px rgba(0, 0, 255, 0.8);
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .mobile-controls.active {
                display: flex;
            }

            .hud {
                font-size: 12px;
            }

            .health-bar {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="ui">
        <div class="hud">
            <div>Player Health</div>
            <div class="health-bar">
                <div class="health-bar-fill" id="healthBarFill"></div>
                <div class="health-text" id="healthText">100/100</div>
            </div>
        </div>
        <div class="info">
            <div id="fps">FPS: 60</div>
            <div id="pos">Pos: 0, 0</div>
            <div id="controls">PC: WASD + Click | SPACE: Dash</div>
        </div>
        <div class="mobile-controls" id="mobileControls">
            <div>
                <div class="joystick-container" id="joystickContainer">
                    <div class="joystick-thumb" id="joystickThumb"></div>
                </div>
            </div>
            <div>
                <button class="dash-button" id="dashButton">⚡</button>
                <button class="attack-button" id="attackButton">⚔️</button>
            </div>
        </div>
    </div>

    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>

    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/systems/MovementSystem.js"></script>
    <script src="js/systems/CombatSystem.js"></script>
    <script src="js/systems/AnimationController.js"></script>
    <script src="js/input/InputManager.js"></script>
    <script src="js/input/KeyboardInput.js"></script>
    <script src="js/input/TouchInput.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/camera/CameraController.js"></script>
    <script src="js/world/WorldBuilder.js"></script>
    <script src="js/scenes/MainScene.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
