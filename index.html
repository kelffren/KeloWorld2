<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelo World 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid #fff;
            image-rendering: pixelated;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 5px;
        }

        .mobile-controls {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            z-index: 100;
        }

        .mobile-controls.active {
            display: flex;
        }

        .joystick {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-thumb {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .attack-btn {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ff4444, #cc0000);
            border: 3px solid #ff8888;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .attack-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui">
        <div>Player HP: <span id="hp">100</span>/100</div>
        <div>Enemy HP: <span id="enemyHp">50</span>/50</div>
        <div id="fps" style="margin-top: 10px; color: #aaa;">FPS: 60</div>
    </div>

    <div class="mobile-controls" id="mobileControls">
        <div class="joystick" id="joystick">
            <div class="joystick-thumb" id="joystickThumb"></div>
        </div>
        <button class="attack-btn" id="attackBtn">⚔️</button>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
