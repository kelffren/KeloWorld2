<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kelo World — GitHub Pages Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(92vw, 560px);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 64px); }
    p { margin: 8px 0; color: #c9c9d2; line-height: 1.5; }
    .ok { margin-top: 18px; font-weight: 700; color: #fff; }
    .badge {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff;
      color: #0b0b0f;
      font-weight: 800;
      letter-spacing: .03em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Kelo World V2</h1>
    <p>Página de prueba para verificar el despliegue con GitHub Pages.</p>
    <p class="ok">Si estás viendo esto desde la URL de Pages, el despliegue funciona correctamente.</p>
    <div class="badge">CAMBIO HECHO DESDE CHATGPT</div>
  </main>
</body>
</html>
